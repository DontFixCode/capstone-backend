version: "3.8"

services:
  studio:
    build:
      context: ..
      dockerfile: apps/studio/Dockerfile
      target: dev
    ports:
      - 8182:8082
    develop:
      watch:
        - action: sync
          path: ../apps/studio
          target: /app/apps/studio
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json

  mail:
    container_name: capstone-supabase-mail
    networks:
      default:
        aliases:
          - supabase-mail
    image: inbucket/inbucket:3.0.3
    ports:
      - '2600:2500' # SMTP
      - '9100:9000' # web interface
      - '1200:1100' # POP3
  auth:
    environment:
      - GOTRUE_SMTP_USER=
      - GOTRUE_SMTP_PASS=
  meta:
    ports:
      - 5655:8080
  db:
    restart: 'no'
    volumes:
      # Always use a fresh database when developing
      - /var/lib/postgresql/data
      # Seed data should be inserted last (alphabetical order)
      - ./dev/data.sql:/docker-entrypoint-initdb.d/seed.sql
  storage:
    volumes:
      - /var/lib/storage
