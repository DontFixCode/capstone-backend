# DB가 있는 서버(bus-transfer-supabase 스택과 같은 호스트)에서 API·워커를 띄우는 배포 구성.
#
#   docker compose -f compose.server.yaml up -d --build
#
# - 두 서비스는 같은 이미지(Dockerfile)를 쓰고, Supabase 스택의 Docker 네트워크에 붙어 DB 컨테이너(서비스 이름 db, 5432)에
#   직접 접속한다(SSH 터널 불필요). 네트워크 이름은 서버에서 `docker network ls`로 확인해 SUPABASE_NETWORK로 지정한다.
# - 비밀값은 이미지에 넣지 않는다. 실행 설정·외부 API 키는 이 저장소의 .env.api(서버에만 두고 커밋하지 않음),
#   DB 이름·비밀번호·JWT 비밀값은 Supabase 스택의 .env를 읽기 전용으로 /app/.env에 연결해 읽는다.
# - 아래 environment 값이 .env.api보다 우선한다(로컬 개발용 터널 주소·devtools 설정을 덮어씀).
# - API 공개 주소는 API_PUBLISH(기본 0.0.0.0:8001). HTTPS·도메인은 앞단 리버스 프록시에서 붙인다.

x-backend: &backend
  build: .
  image: capstone-backend:latest
  env_file:
    - path: .env.api
      required: true
  environment:
    BACKEND_ENV: production
    ENABLE_DEVTOOLS: "false"
    BACKEND_DB_HOST: ${BACKEND_DB_HOST_IN_NETWORK:-db}
    BACKEND_DB_PORT: "5432"
  volumes:
    - ${SUPABASE_ENV_FILE:-../bus-transfer-supabase/deployment/.env}:/app/.env:ro
  networks:
    - supabase
  restart: unless-stopped

name: capstone-backend

services:
  api:
    <<: *backend
    ports:
      - "${API_PUBLISH:-0.0.0.0:8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    <<: *backend
    # 실시간 수집(대전시 도착정보·TAGO 위치)·정적 하루 1회 갱신·앱 작업(검색·이동 안내 재계산)을 한 프로세스에서 돈다.
    # 워커는 한 서버에 하나만 띄운다(로컬 PC 워커와 동시에 같은 DB를 쓰지 않는다).
    command: ["python", "-m", "app.workers.main"]

networks:
  supabase:
    external: true
    name: ${SUPABASE_NETWORK:-bus-transfer-supabase_default}
