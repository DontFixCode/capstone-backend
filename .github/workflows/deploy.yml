# main 브랜치에 push하면 서버에 SSH로 접속해 최신 코드로 갱신합니다.
# 필요한 GitHub Secrets (레포 Settings → Secrets and variables → Actions):
#   SERVER_HOST     서버 IP 또는 도메인
#   SERVER_USER     SSH 사용자 (예: ubuntu)
#   SERVER_SSH_KEY  SSH 개인키 전체 내용
#   SERVER_PORT     (선택) SSH 포트, 기본 22
name: Deploy to server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            cd ~/capstone-backend
            git pull --ff-only origin main
            docker compose up -d --wait
            docker compose exec -T db bash /docker/migrate.sh
            docker compose ps
