# This file is loaded only by the bus-public-auth proxy container.
log_format bus_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $bus_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    server_name 121.153.148.189;
    ssl_certificate /etc/bus-certificates/live/bus-public-ip/fullchain.pem;
    ssl_certificate_key /etc/bus-certificates/live/bus-public-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /dev/stdout bus_safe;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location = /health {
        default_type text/plain;
        return 200 "bus-public-auth\n";
    }
    location ^~ /auth/v1/ {
        set $bus_auth http://bus-transfer-supabase-api-gw-1:8000;
        proxy_pass $bus_auth;
    }
    location ^~ /api/v1/ {
        set $bus_api http://capstone-backend-api-1:8001;
        proxy_pass $bus_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bus_connection_upgrade;
        # nginx header inheritance is replaced when a location defines any headers.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
    location / { return 404; }
}
