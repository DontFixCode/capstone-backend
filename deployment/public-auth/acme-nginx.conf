# Bus project only: IP certificate validation; preserve existing 404 for other IP paths.
server {
    listen 80;
    server_name 121.153.148.189;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/bus-auth/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
