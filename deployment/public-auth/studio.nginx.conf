# Loaded only by the bus-public-auth studio-proxy container.
log_format bus_studio_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
map $http_upgrade $bus_studio_connection_upgrade {
    default upgrade;
    '' close;
}

map $http_origin $bus_studio_foreign_origin {
    default 1;
    "" 0;
    "https://121.153.148.189:18444" 0;
}

server {
    listen 443 ssl;
    server_name 121.153.148.189;
    ssl_certificate /etc/bus-certificates/live/bus-public-ip/fullchain.pem;
    ssl_certificate_key /etc/bus-certificates/live/bus-public-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /dev/stdout bus_studio_safe;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    if ($bus_studio_foreign_origin) { return 403; }

    auth_basic "Bus Studio";
    auth_basic_user_file /etc/nginx/studio.htpasswd;

    location ^~ /mcp { return 403; }
    location ^~ /api/mcp { return 403; }

    location / {
        set $bus_studio http://bus-transfer-supabase-studio-1:3000;
        proxy_pass $bus_studio;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 18444;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $bus_studio_connection_upgrade;
        proxy_set_header Authorization "";
    }
}
